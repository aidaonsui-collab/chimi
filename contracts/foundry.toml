[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./script/bytecode" },
    { access = "write", path = "./../web/public" },
]
allow_paths = ["../../arcfun/contracts/arc-instant/lib"]

remappings = [
    "forge-std/=../../arcfun/contracts/arc-instant/lib/forge-std/src/",
    "@openzeppelin/contracts/=../../arcfun/contracts/arc-instant/lib/openzeppelin-contracts/contracts/",
    "v4-core/=../../arcfun/contracts/arc-instant/lib/v4-core/",
]

[profile.deploy]
optimizer = true
optimizer_runs = 1
via_ir = true
