[profile.default]
src = "src"
out = "out"
libs = ["node_modules"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read", path = "./script/bytecode" },
    { access = "read-write", path = "./../web/public" },
]

# Libraries come from `npm install` (see package.json), pinned to the versions the live contracts
# were built with, so a fresh build gives the same bytecode that is on GIWA Sepolia.
remappings = [
    "forge-std/=node_modules/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "v4-core/=node_modules/@uniswap/v4-core/",
    "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
]

[profile.deploy]
optimizer = true
optimizer_runs = 1
via_ir = true
